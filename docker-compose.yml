services:
  db:
    image: postgis/postgis:17-3.7
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nasa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nasa}
      POSTGRES_DB: ${POSTGRES_DB:-nasa}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
